name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - run: cargo test --workspace
      - run: cargo test -p chonkie --no-default-features --features gpt2

      - name: test against real tokenizers
        run: |
          mkdir -p "$RUNNER_TEMP/tokenizers" && cd "$RUNNER_TEMP/tokenizers"
          curl -sfL -o gpt2.json https://huggingface.co/openai-community/gpt2/resolve/main/tokenizer.json
          curl -sfL -o bert.json https://huggingface.co/google-bert/bert-base-uncased/resolve/main/tokenizer.json
          curl -sfL -o cl100k.json https://huggingface.co/Xenova/gpt-4/resolve/main/tokenizer.json
          cd "$GITHUB_WORKSPACE"
          CHONKIE_TEST_TOKENIZERS="$RUNNER_TEMP/tokenizers" cargo test --workspace --release -- --include-ignored

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
