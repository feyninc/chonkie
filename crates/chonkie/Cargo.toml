[package]
name = "chonkie"
description = "Small, fast, correct text chunking"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["chunking", "text", "rag", "tokenizer", "nlp"]
categories = ["text-processing"]

[dependencies]
memchr = "2"
tokie = { version = "0.2.1", default-features = false }

[features]
default = ["hub"]
# Download tokenizers from the Hugging Face Hub on first use, and cache them.
hub = ["tokie/hub"]
# Build the gpt2 tokenizer (3.9MB) into the binary, for offline use and the browser.
gpt2 = []
