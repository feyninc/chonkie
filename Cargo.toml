[workspace]
members = ["crates/chonkie"]
resolver = "3"

[workspace.package]
version = "2.0.0-alpha.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/feyninc/chonkie"

[profile.release]
lto = true
codegen-units = 1

# The tests count tokens over and over; an unoptimized tokenizer makes them slow.
[profile.dev.package."*"]
opt-level = 3
